[package]
name = "blinc-bench"
description = "Window harnesses for frame cost and animation paths (scroll_bench, flip_window_check, node_table_repro). Not published, and not part of the examples page."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Run explicitly:
#   cargo run --release -p blinc-bench --example scroll_bench
[dependencies]
blinc_app = { path = "../../crates/blinc_app", features = ["windowed"] }
blinc_core = { path = "../../crates/blinc_core" }
blinc_layout = { path = "../../crates/blinc_layout" }
blinc_animation = { path = "../../crates/blinc_animation" }
tracing.workspace = true
tracing-subscriber.workspace = true
