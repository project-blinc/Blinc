[package]
name = "blinc_platform_desktop"
description = "Blinc desktop platform - macOS, Windows, Linux windowing and input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/blinc_platform_desktop"
rust-version.workspace = true

[lib]
crate-type = ["lib"]

[features]
default = []

[dependencies]
# Platform abstraction
blinc_platform = { path = "../../crates/blinc_platform", version = "0.6.0" }

# Windowing
winit.workspace = true
raw-window-handle.workspace = true

# Logging
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
