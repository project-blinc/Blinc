[package]
name = "blinc_component_demos"
description = "Shared native recordings and worker-rendered component demos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "capture-components"
path = "src/capture.rs"
required-features = ["capture"]

[[example]]
name = "installation"
required-features = ["native"]

[features]
default = []
native = ["blinc_app/windowed"]
capture = ["dep:blinc_recorder", "dep:gif"]
# Same worker transport with deterministic multi-control browser fixtures.
browser-tests = []

[dependencies]
blinc_animation = { path = "../../crates/blinc_animation" }
blinc_app = { path = "../../crates/blinc_app", default-features = false }
blinc_cn = { path = "../../crates/blinc_cn" }
blinc_icons = { path = "../../crates/blinc_icons" }
blinc_core = { path = "../../crates/blinc_core" }
blinc_layout = { path = "../../crates/blinc_layout", features = ["media"] }
blinc_media = { path = "../../crates/blinc_media" }
blinc_theme = { path = "../../crates/blinc_theme" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blinc_recorder = { path = "../../crates/blinc_recorder", optional = true, features = ["headless"] }
gif = { version = "0.13", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
blinc_app = { path = "../../crates/blinc_app", default-features = false, features = ["web"] }
blinc_platform = { path = "../../crates/blinc_platform" }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["OffscreenCanvas"] }
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--all-features']

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
