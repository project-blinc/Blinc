name: Documentation

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/book/**'
      - 'web/**'
      - 'wrangler.jsonc'
      - '.github/workflows/docs.yml'
      - 'crates/*/src/**'
      - 'examples/blinc_app_examples/examples/**'
      - 'examples/blinc_component_demos/**'
      - 'extensions/*/src/**'
      - 'tools/build-web-examples/**'
      - 'assets/**'
      - 'Cargo.lock'
      - 'scripts/book_versions.py'
      - 'scripts/book_cdn.py'
      - 'scripts/tests/test_book_cdn.py'
      - 'scripts/tests/test_book_versions.py'
      - 'scripts/tests/test_book_release_restore.py'
      - 'scripts/check_book_examples.py'
      - '.github/scripts/prepare-book-releases.py'
  pull_request:
    branches: [main]
    paths:
      - 'docs/book/**'
      - 'web/**'
      - 'wrangler.jsonc'
      - '.github/workflows/docs.yml'
      - 'crates/*/src/**'
      - 'examples/blinc_app_examples/examples/**'
      - 'examples/blinc_component_demos/**'
      - 'extensions/*/src/**'
      - 'tools/build-web-examples/**'
      - 'assets/**'
      - 'Cargo.lock'
      - 'scripts/book_versions.py'
      - 'scripts/book_cdn.py'
      - 'scripts/tests/test_book_cdn.py'
      - 'scripts/tests/test_book_versions.py'
      - 'scripts/tests/test_book_release_restore.py'
      - 'scripts/check_book_examples.py'
      - '.github/scripts/prepare-book-releases.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "site"
  cancel-in-progress: false

jobs:
  # The 48 example wrappers build one after another in about twenty minutes, so they are spread
  # over runners. The shard count is the repository variable WRAPPER_SHARDS (default 6): raise
  # it for a faster build, lower it to spend fewer runner minutes.
  shards:
    name: Plan wrapper shards
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.plan.outputs.list }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - id: plan
        env:
          REQUESTED: ${{ vars.WRAPPER_SHARDS }}
        run: |
          count="${REQUESTED:-6}"
          if ! [[ "$count" =~ ^[0-9]+$ ]] || [ "$count" -lt 1 ] || [ "$count" -gt 24 ]; then
            echo "WRAPPER_SHARDS must be a whole number from 1 to 24, got '$count'" >&2
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "list=$(python3 -c 'import json,sys; print(json.dumps(list(range(1, int(sys.argv[1]) + 1))))' "$count")" >> "$GITHUB_OUTPUT"

  wrappers:
    name: Build wrappers (${{ matrix.shard }}/${{ needs.shards.outputs.count }})
    needs: shards
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || '' }}
      - name: Strip local-dev [patch] block (CI-only)
        shell: bash
        run: bash scripts/ci-strip-local-patch.sh

      - name: Setup Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      # Every shard compiles the same dependencies, so one shard saves the cache for the rest.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/_generated
          prefix-key: "docs-v1"
          # The book job's cache, so the first sharded run does not start cold.
          shared-key: build
          save-if: ${{ matrix.shard == 1 }}

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi

      # Same tool setup as the book job: see the notes there on why wasm-bindgen-cli is
      # pre-installed and linked into wasm-pack's cache, and why binaryen comes from apt.
      - name: Install wasm-bindgen-cli (matches workspace 0.2.106)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.106

      - name: Pre-populate wasm-pack tool cache
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION=0.2.106
          BIN=$(command -v wasm-bindgen)
          test -n "$BIN"
          CACHE="$HOME/.cache/.wasm-pack"
          mkdir -p "$CACHE/wasm-bindgen-$WASM_BINDGEN_VERSION"
          mkdir -p "$CACHE/wasm-bindgen-cargo-install-$WASM_BINDGEN_VERSION/bin"
          ln -sf "$BIN" "$CACHE/wasm-bindgen-$WASM_BINDGEN_VERSION/wasm-bindgen"
          ln -sf "$BIN" "$CACHE/wasm-bindgen-cargo-install-$WASM_BINDGEN_VERSION/bin/wasm-bindgen"

      - name: Install fresh binaryen (wasm-opt)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt --version || true

      - name: Build this shard of the example wrappers
        run: |
          cargo run -p blinc-build-web-examples -- --no-gallery --shard "${{ matrix.shard }}/${{ needs.shards.outputs.count }}"

      # `target/` is restored from the cargo cache, so a previous run's output can already be
      # here: start from nothing, and copy the contents so an existing directory never nests.
      - name: Collect the built wrappers
        run: |
          rm -rf target/wrapper-shard
          mkdir -p target/wrapper-shard
          for dir in examples/_generated/*/; do
            if [ -f "$dir/pkg/package.json" ]; then
              name=$(basename "$dir")
              mkdir -p "target/wrapper-shard/$name/pkg"
              cp -R "$dir/pkg/." "target/wrapper-shard/$name/pkg/"
            fi
          done
          ls target/wrapper-shard | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: wrappers-${{ matrix.shard }}
          path: target/wrapper-shard
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build Book
    needs: wrappers
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && 'main' || '' }}
      - name: Strip local-dev [patch] block (CI-only)
        shell: bash
        run: bash scripts/ci-strip-local-patch.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test book edition assembly
        run: python3 -m unittest scripts.tests.test_book_versions scripts.tests.test_book_release_restore scripts.tests.test_book_cdn

      # The codegen tool + wasm-pack invocations need a working
      # Rust toolchain with the wasm32 target. Cached between runs
      # via `Swatinem/rust-cache` so the 41 wrapper compiles amortise
      # to ~5-10 minutes on a warm cache (cold is ~25-35 minutes).
      - name: Setup Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Include the auto-generated wrapper tree so incremental
          # builds amortise across runs. The wrappers themselves are
          # gitignored, so without this key they'd rebuild from
          # scratch every time.
          workspaces: |
            .
            examples/_generated
          # Keep caches separate from the main CI workflow — the
          # wasm32 target dir pulls in a different dep tree.
          prefix-key: "docs-v1"

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi

      # Pre-install `wasm-bindgen-cli` once, at the exact version the
      # workspace's `Cargo.lock` resolves `wasm-bindgen` to. Without
      # this, every `wasm-pack build` invocation in the loop below
      # re-checks for a matching CLI on PATH and downloads/installs
      # it into `~/.cache/.wasm-pack/` if absent — across 40+
      # wrappers that's tens of minutes of redundant install steps,
      # most of which we'd amortise away by having a single binary
      # on PATH already.
      #
      # `taiki-e/install-action` ships prebuilt binaries so this is
      # ~10 seconds vs `cargo install --locked wasm-bindgen-cli`'s
      # ~5 minutes from source. Version pinned manually — bump in
      # lockstep with the workspace `wasm-bindgen` dep when it moves.
      - name: Install wasm-bindgen-cli (matches workspace 0.2.106)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.106

      # wasm-pack 0.13 looks for `wasm-bindgen` exclusively in its
      # own cache directory under `~/.cache/.wasm-pack/wasm-bindgen-VERSION/`
      # — even when a matching binary is on PATH, the binary-install
      # crate it uses does NOT consult PATH. Symptom in CI logs:
      # "[INFO]: ⬇️  Installing wasm-bindgen..." printed once per
      # wasm-pack invocation, with the actual download repeating.
      #
      # Pre-populate the cache slot by symlinking the
      # `taiki-e/install-action`-installed binary (already on PATH)
      # into the path wasm-pack expects. Both layouts that wasm-pack
      # has used historically (`wasm-bindgen-VERSION/wasm-bindgen`
      # for prebuilt downloads, `wasm-bindgen-cargo-install-VERSION/
      # bin/wasm-bindgen` for source builds) get a symlink so this
      # works across wasm-pack version bumps without further edits.
      - name: Pre-populate wasm-pack tool cache
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION=0.2.106
          BIN=$(command -v wasm-bindgen)
          test -n "$BIN"
          CACHE="$HOME/.cache/.wasm-pack"
          mkdir -p "$CACHE/wasm-bindgen-$WASM_BINDGEN_VERSION"
          mkdir -p "$CACHE/wasm-bindgen-cargo-install-$WASM_BINDGEN_VERSION/bin"
          ln -sf "$BIN" "$CACHE/wasm-bindgen-$WASM_BINDGEN_VERSION/wasm-bindgen"
          ln -sf "$BIN" "$CACHE/wasm-bindgen-cargo-install-$WASM_BINDGEN_VERSION/bin/wasm-bindgen"
          ls -la "$CACHE"

      # wasm-pack 0.13 ships its own bundled `wasm-opt` (binaryen
      # 116). That binary segfaults on the larger generated wasm
      # modules (e.g. `cn_demo` — 1666 generated icon constants +
      # the full `blinc_cn` component set). Installing a modern
      # binaryen via apt puts a fresh `wasm-opt` on PATH, and
      # wasm-pack will prefer the system binary over its bundled
      # one when both exist.
      - name: Install fresh binaryen (wasm-opt)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt --version || true

      # Regenerates `examples/_generated/<name>/` wrapper crates from the cross-target source in
      # `examples/blinc_app_examples/examples/` and rewrites the gallery markdown + SUMMARY patch
      # in `docs/book/src/web/`. The wasm builds ran in the `wrappers` shards; their `pkg/`
      # directories are restored here and stay until the staging step below copies them into the
      # book output. Nothing is cached between runs, so every build is made from this commit.
      #
      # `mdbook build` wipes and rewrites `target/book/`, so we
      # can't stage into `target/book/examples/` yet — staging
      # happens after mdBook runs.
      - name: Generate example wrappers and book pages
        run: cargo run -p blinc-build-web-examples

      - name: Fetch the built example wrappers
        uses: actions/download-artifact@v4
        with:
          pattern: wrappers-*
          merge-multiple: true
          path: examples/_generated

      - name: Check book application examples
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          python3 scripts/check_book_examples.py
          python3 scripts/check_book_examples.py --wasm

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.40'

      - name: Restore released books
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_BUILD_JOBS: 2
          BLINC_BOOK_UPLOAD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        run: python3 .github/scripts/prepare-book-releases.py

      # Build main separately so it cannot replace the released book.
      - name: Build development book
        run: python3 scripts/book_versions.py build --source . --output target/book-dev --edition dev --commit "$(git rev-parse HEAD)"

      # Stage after mdBook, which replaces its output directory.
      - name: Stage example artifacts into book output
        run: |
          cargo run -p blinc-build-web-examples -- \
            --no-gallery \
            --no-build \
            --stage-to target/book-dev/examples

      # Keep the landing page and book together. The following catalog step
      # replaces the copied component sources with generated pages and assets.
      - name: Copy landing page (web/) into site root
        run: |
          mkdir -p target/site
          cp -a web/. target/site/

      - name: Build component pages and worker runtime
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo run -p blinc-build-web-examples -- --catalog-to target/site --build

      - name: Validate component catalog
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          cargo test -p blinc-build-web-examples catalog::
          node --experimental-vm-modules --test web/components/tests/*.test.mjs
          node web/components/tests/artifacts.mjs target/site

      - name: Assemble stable and versioned books
        run: python3 scripts/book_versions.py assemble --dev target/book-dev --archives target/book-releases --output target/site/docs

      # The demo WASM modules and sample assets are about 700 MB per book edition, and the site
      # worker takes at most 25 MiB per file. On a published build they move to the asset origin
      # (repository variable ASSET_BASE_URL) as content-addressed, immutable objects, and are
      # checked over HTTP before the pages that point at them are uploaded. Without the variable
      # nothing is uploaded or deployed, and the live site stays as it was.
      - name: Move demo WASM and assets to the asset origin
        if: github.event_name != 'pull_request' && vars.ASSET_BASE_URL != ''
        run: python3 scripts/book_cdn.py externalize --docs target/site/docs --base "${{ vars.ASSET_BASE_URL }}" --objects target/asset-origin

      # Objects are named by their hash, so an existing key is never given different content.
      - name: Upload demo WASM and assets to the asset bucket
        if: github.event_name != 'pull_request' && vars.ASSET_BASE_URL != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          cache="public, max-age=31536000, immutable"
          aws s3 sync target/asset-origin/wasm "s3://${{ vars.R2_BUCKET }}/wasm" \
            --endpoint-url "$endpoint" --size-only --content-type application/wasm --cache-control "$cache"
          aws s3 sync target/asset-origin/asset "s3://${{ vars.R2_BUCKET }}/asset" \
            --endpoint-url "$endpoint" --size-only --cache-control "$cache"

      - name: Verify the asset origin serves the demo objects
        if: github.event_name != 'pull_request' && vars.ASSET_BASE_URL != ''
        run: python3 scripts/book_cdn.py verify --base "${{ vars.ASSET_BASE_URL }}" --objects target/asset-origin --origin "https://$(tr -d '[:space:]' < web/CNAME)"

      - name: Upload artifact
        if: github.event_name != 'pull_request' && vars.ASSET_BASE_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: target/site
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare
    if: vars.ASSET_BASE_URL != '' && ((github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'release' && !github.event.release.prerelease))
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://blinc.rs/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: target/site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Content-hashed files already on the worker are skipped, so only what changed is uploaded.
      - name: Deploy the site worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 deploy

  wiki:
    name: Sync to GitHub Wiki
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip local-dev [patch] block (CI-only)
        shell: bash
        run: bash scripts/ci-strip-local-patch.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Clone Wiki Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git wiki

      - name: Convert Book to Wiki
        run: python3 .github/scripts/book-to-wiki.py

      - name: Push to Wiki
        run: |
          cd wiki
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync documentation from main branch"
            git push
          fi
