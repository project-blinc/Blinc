name: Android

on:
  push:
    branches: [main]
    paths:
      - 'extensions/blinc_platform_android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extensions/blinc_platform_android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - '.github/workflows/android.yml'
  workflow_dispatch:  # Allow manual triggering

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Reduce disk usage on GitHub-hosted runners (debug info + incremental artifacts can be large).
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-android    # ARM64 (most devices)
          - armv7-linux-androideabi  # ARMv7 (older 32-bit)
          - x86_64-linux-android     # x86_64 (emulator)

    steps:
      - uses: actions/checkout@v4
      - name: Strip local-dev [patch] block (CI-only)
        shell: bash
        run: bash scripts/ci-strip-local-patch.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Install the NDK via sdkmanager directly with retries. The
      # android-actions/setup-android action does not retry, and its NDK
      # download intermittently corrupts mid-extract ("Error on ZipFile
      # unknown archive"), failing the whole matrix. Retry with a clean
      # slate between attempts so a partial download can't poison a retry.
      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VER=27.0.12077973
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
          fi
          [ -n "$SDKMANAGER" ] || { echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 1; }
          echo "Using sdkmanager: $SDKMANAGER"
          for attempt in 1 2 3 4; do
            # `yes` feeds license prompts; it takes SIGPIPE once sdkmanager
            # stops reading (harmless "Broken pipe" that pipefail would
            # otherwise treat as failure), so swallow the pipe status and
            # judge success by the installed toolchains dir instead.
            yes 2>/dev/null | "$SDKMANAGER" "ndk;${NDK_VER}" || true
            if [ -d "$ANDROID_HOME/ndk/${NDK_VER}/toolchains" ]; then
              echo "NDK ${NDK_VER} installed on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::NDK install attempt ${attempt} failed; clearing partial download"
            rm -rf "$ANDROID_HOME/ndk/${NDK_VER}"
            sleep $((attempt * 10))
          done
          echo "::error::NDK ${NDK_VER} install failed after 4 attempts"
          exit 1

      - name: Set up NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          TOOLCHAIN_BIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$TOOLCHAIN_BIN" >> $GITHUB_PATH

          # Set linkers for each target
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN_BIN}/aarch64-linux-android35-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=${TOOLCHAIN_BIN}/armv7a-linux-androideabi35-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=${TOOLCHAIN_BIN}/x86_64-linux-android35-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=${TOOLCHAIN_BIN}/i686-linux-android35-clang" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-android-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-${{ matrix.target }}-

      - name: Build for ${{ matrix.target }}
        run: cargo build --target ${{ matrix.target }} -p blinc_platform_android --profile release-small

      - name: Strip library
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            target/${{ matrix.target }}/release-small/libblinc_platform_android.so || true

      - name: Show library size
        run: ls -lh target/${{ matrix.target }}/release-small/libblinc_platform_android.*

      - name: Upload Android library
        uses: actions/upload-artifact@v4
        with:
          name: libblinc_platform_android-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release-small/libblinc_platform_android.so
          if-no-files-found: warn

  # Verify host builds still work with Android crate in workspace
  check-host:
    name: Check Host Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip local-dev [patch] block (CI-only)
        shell: bash
        run: bash scripts/ci-strip-local-patch.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libfontconfig1-dev \
            libglib2.0-dev \
            libatk1.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libxdo-dev \
            libasound2-dev \
            fonts-dejavu-core \
            xvfb

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-android-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-check-

      - name: Check workspace builds on host
        run: cargo check --workspace

      - name: Run tests
        run: xvfb-run --auto-servernum cargo test --workspace --exclude blinc_dsl_core --exclude blinc_cn_dsl --exclude blinc_dsl_macro
        env:
          MESA_GL_VERSION_OVERRIDE: "4.5"
          LIBGL_ALWAYS_SOFTWARE: "1"
