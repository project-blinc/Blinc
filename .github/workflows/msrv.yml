name: MSRV

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip local-dev [patch] block (CI-only)
        shell: bash
        run: bash scripts/ci-strip-local-patch.sh

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            fonts-dejavu-core \
            libglib2.0-dev \
            libatk1.0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libxdo-dev \
            libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89'

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      # The release crates only: the DSL crates are outside the release and their
      # dependencies need a newer compiler.
      - name: Check release crates on MSRV
        run: |
          packages=$(python3 scripts/publish_crates.py --plan | awk '/^ *[0-9]+\./ {sub(/@.*/, "", $2); printf "-p %s ", $2}')
          cargo check $packages --all-targets
