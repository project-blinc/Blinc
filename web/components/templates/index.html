<h1 class="catalog-title">Components</h1>
<div class="catalog-tools"><label class="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="component-search" type="search" placeholder="Find a component…" aria-label="Search components"><kbd aria-hidden="true">/</kbd></label><button type="button" class="preview-toggle" id="toggle-grid-animation" aria-pressed="true"><span class="animation-icon" aria-hidden="true"></span><span class="animation-label">Pause previews</span></button></div>
<div class="category-filters" role="group" aria-label="Filter components by category">{{FILTERS}}</div>
<div class="grid-heading"><span id="result-count" role="status">{{COUNT}} components</span></div>
<div class="component-grid">{{CARDS}}</div>
<p class="empty-results" id="empty-results" hidden>No components match. Try a different search.</p>
