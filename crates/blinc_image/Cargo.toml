[package]
name = "blinc_image"
description = "Image loading and rendering for Blinc UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/blinc_image"
rust-version.workspace = true
keywords = ["ui", "gui", "image", "blinc"]
categories = ["gui", "multimedia::images"]

[dependencies]
# Image decoding. Per-format decoders are gated by the cargo features
# below. The default PNG and JPEG decoders use the `png` and `zune-jpeg`
# crates; GIF/WebP/BMP/TIFF/AVIF turn on `image` with the matching codec,
# and `all-formats` turns on every built-in format. Apps that need a
# different decoder entirely (zune-image, libvips, a headless stub for
# tests) build with `default-features = false` and register a custom
# `ImageDecoder` via `DecoderRegistry`.
image = { version = "0.25", default-features = false, optional = true }
# The PNG and JPEG decoders, at the versions `image` uses, so turning on an `image` format adds no copy.
png = { version = "0.18.1", optional = true }
zune-jpeg = { version = "0.5.15", optional = true }
zune-core = { version = "0.5.3", optional = true }

# Async/networking for URL loading
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

# Base64 decoding
base64 = "0.22"

# Error handling
thiserror = "2"

# Tracing
tracing = "0.1"

# Platform asset loading (optional)
blinc_platform = { path = "../blinc_platform", version = "0.6.0", optional = true }

# Text rendering for emoji (optional)
blinc_text = { path = "../blinc_text", version = "0.6.0", optional = true }

[features]
# `png` + `jpeg` cover almost every UI-image use case (icons, logos,
# illustrations, photos). Apps that need `gif` / `webp` / `bmp` /
# `tiff` / `avif` opt in explicitly. Apps that need none of these
# (e.g. they fetch already-decoded RGBA, or register their own
# `ImageDecoder`) use `default-features = false`.
default = ["platform", "emoji", "png", "jpeg"]
network = ["reqwest", "tokio"]
platform = ["blinc_platform"]
emoji = ["blinc_text"]

# Per-format built-in decoders, each registered with the default
# `DecoderRegistry`. PNG and JPEG decode with their own crates; the
# others turn on the matching format of the upstream `image` crate.
# Off by default unless listed in `default` above.
png = ["dep:png"]
jpeg = ["dep:zune-jpeg", "dep:zune-core"]
gif = ["dep:image", "image/gif"]
webp = ["dep:image", "image/webp"]
bmp = ["dep:image", "image/bmp"]
tiff = ["dep:image", "image/tiff"]
avif = ["dep:image", "image/avif"]

# Umbrella that matches the pre-split set of built-in formats —
# enables every format that previously shipped with `default`.
all-formats = ["png", "jpeg", "gif", "webp", "bmp"]

[dev-dependencies]
# The reference the built-in PNG and JPEG decoders are checked against.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
