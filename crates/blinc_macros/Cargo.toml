[package]
name = "blinc_macros"
description = "Procedural macros for Blinc UI framework"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/blinc_macros"
rust-version.workspace = true
keywords = ["ui", "gui", "macros", "blinc"]
categories = ["gui", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
blinc_core = { path = "../blinc_core", version = "0.6.0" }
blinc_flow = { path = "../blinc_flow", version = "0.6.0" }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
naga = { version = "26", features = ["wgsl-in"] }
