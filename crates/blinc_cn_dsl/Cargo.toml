[package]
name = "blinc_cn_dsl"
description = "DSL bindings for the blinc_cn widget pack — exposes cn.* widgets to the Blinc DSL via #[extern_widget]"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/blinc_cn_dsl"
rust-version.workspace = true

[lib]
crate-type = ["lib"]

[dev-dependencies]
# Animated widgets (Spinner, Progress) call `get_scheduler()` at build
# time; render tests install a global scheduler the way an app would.
blinc_animation = { path = "../blinc_animation", version = "0.5.1" }
# `tracing_subscriber::fmt::try_init` for the integration tests.
tracing-subscriber.workspace = true
# Renderer surface + ZyntaxValue used to materialise widgets through
# the JIT in end-to-end tests.
blinc_runtime = { path = "../blinc_runtime", version = "0.5.1" }
zyntax_embed = { git = "https://github.com/darmie/zyntax", rev = "3039f8698730e57a8a0c1295ac1bb9f796bfc3c7" }
# Desktop windowed runner for the cn_dsl_demo example. Same posture
# `blinc_dsl_core` uses for counter_dsl / reactive_dsl.
blinc_app = { path = "../blinc_app", default-features = false, features = ["windowed"] }
# `ColorScheme` enum + `ThemeBundle` for `run_with_theme`.
blinc_theme = { path = "../blinc_theme", version = "0.5.1" }

[[example]]
name = "cn_dsl_demo"
path = "examples/cn_dsl_demo.rs"

[[example]]
name = "cn_playground"
path = "examples/cn_playground.rs"

[dependencies]
# Needed to forward `ElementBuilder::layout_style`, whose return type is
# `Option<&taffy::Style>`. Widgets with intrinsic sizing (textarea rows,
# input height) carry that size in the taffy style, so a wrapper that
# cannot forward it hides the size from any builder-tree reader.
taffy = { workspace = true }
# DSL surface — host registration API + the `#[extern_widget]` macro
# that generates the FFI thunks. We hold the BlincDsl handle and call
# `register_extern_widget::<W>()` per wrapper.
blinc_dsl_core = { path = "../blinc_dsl_core", version = "0.5.1" }

# Widget catalog being exposed. Each `cn.<Name>` wrapper in this crate
# delegates construction to a `blinc_cn::<name>` builder.
blinc_cn = { path = "../blinc_cn", version = "0.5.1" }

# `ElementBuilder` is the trait every widget returns; the wrappers
# need it in scope so the macro can box the build result.
blinc_layout = { path = "../blinc_layout", version = "0.5.1" }

# `Color::from_hex` for the shared string-hex colour parser used by
# every widget exposing a colour prop. Also `blinc_core::reactive::*`
# for the `Reactive<T>` Signal → Computed bridge in widget wrappers.
blinc_core = { path = "../blinc_core", version = "0.5.1" }

# Logging — unknown-variant / unknown-size diagnostics surface as
# `tracing::warn!` so DSL typos show up without breaking the build.
tracing.workspace = true

[features]
# Recompile the playground's `.blinc` files while it runs. Opt-in: it
# pulls a filesystem watcher into the dep tree, and a shipped app has
# no reason to watch its own sources.
hot-reload = ["blinc_app/hot-reload"]
