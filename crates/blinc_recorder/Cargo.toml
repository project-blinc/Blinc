[package]
name = "blinc_recorder"
description = "Recording and debugging infrastructure for Blinc applications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/blinc_recorder"
rust-version.workspace = true
publish = false

[features]
default = []
png = ["dep:png"]
# `testing::Headless`: a real UI built and painted offscreen.
headless = ["png", "dep:blinc_app", "dep:blinc_layout", "dep:blinc_theme", "dep:blinc_animation", "dep:wgpu"]

[dependencies]
png = { version = "0.17", optional = true }
blinc_core = { path = "../blinc_core", version = "0.5.1" }
blinc_app = { path = "../blinc_app", version = "0.5.1", optional = true }
blinc_layout = { path = "../blinc_layout", version = "0.5.1", optional = true, features = ["recorder"] }
blinc_theme = { path = "../blinc_theme", version = "0.5.1", optional = true }
blinc_animation = { path = "../blinc_animation", version = "0.5.1", optional = true }
wgpu = { workspace = true, optional = true }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
tracing.workspace = true

[dev-dependencies]
blinc_cn = { path = "../blinc_cn", version = "0.5.1" }
blinc_theme = { path = "../blinc_theme", version = "0.5.1" }
blinc_layout = { path = "../blinc_layout", version = "0.5.1", features = ["recorder"] }
