[package]
name = "blinc_cn"
description = "Blinc Component Library - shadcn-style themed components built on blinc_layout primitives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/blinc_cn"
rust-version.workspace = true

[lib]
crate-type = ["lib"]

[features]
default = []

[dependencies]
# Primitives layer
blinc_layout = { path = "../blinc_layout", version = "0.6.0" }
blinc_core = { path = "../blinc_core", version = "0.6.0" }
blinc_animation = { path = "../blinc_animation", version = "0.6.0" }
blinc_theme = { path = "../blinc_theme", version = "0.6.0" }
blinc_macros = { path = "../blinc_macros", version = "0.6.0" }
blinc_icons = { path = "../blinc_icons", version = "0.6.0" }

# Layout
taffy.workspace = true

# Logging
tracing.workspace = true

# The calendar's swipe: the gap between two scroll events.
web-time = "1.1"

# Today's local date, for the calendar.
[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
tracing-subscriber = { workspace = true }
